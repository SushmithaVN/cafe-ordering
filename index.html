<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Paradise Cafe</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
</head>
<body>

  <div id="stickyTop">
    <div class="brand-row">
      <h1>Paradise Cafe</h1>
      <p class="tagline">Dine in the lap of nature</p>
    </div>

    <div class="table-select-row">
      <label for="tableNumber">Table</label>
      <select id="tableNumber">
        <option value="1">1</option>
        <option value="2">2</option>
        <option value="3">3</option>
        <option value="4">4</option>
        <option value="5">5</option>
        <option value="6">6</option>
        <option value="7">7</option>
        <option value="8">8</option>
        <option value="9">9</option>
        <option value="10">10</option>
        <option value="11">11</option>
        <option value="12">12</option>
      </select>
    </div>

    <input type="text" id="searchInput" placeholder="Search dishes...">

    <div id="dietFilterRow">
      <button class="diet-btn active" data-diet="all">All</button>
      <button class="diet-btn" data-diet="veg">Veg</button>
      <button class="diet-btn" data-diet="non-veg">Non-Veg</button>
    </div>
  </div>

  <div id="menuContainer">
    <p class="loading-text">Loading menu...</p>
  </div>

  <h2 class="section-heading">Your Order</h2>
  <div id="cart"></div>

  <!-- Floating jump-to-category button -->
  <button id="menuJumpBtn">☰ Menu</button>

  <!-- Category jump sheet -->
  <div id="categorySheetOverlay">
    <div id="categorySheet">
      <div class="sheet-handle"></div>
      <h3>Jump to a section</h3>
      <div id="categoryListItems"></div>
    </div>
  </div>

  <div id="stickyBar">
    <span id="stickyText">0 items · ₹0</span>
    <button id="placeOrderBtn">Place Order via WhatsApp</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
