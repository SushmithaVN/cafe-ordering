<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Paradise Cafe</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
</head>
<body>

  <!-- Welcome overlay - blocks everything until a table is picked -->
  <div id="welcomeOverlay">
    <div class="welcome-card">
      <img src="images/paradise-cafe-logo.jpg" alt="Paradise Cafe" class="welcome-logo">
      <h1>Paradise Cafe</h1>
      <p class="tagline">Dine in the lap of nature</p>
      <p class="welcome-question">Which table are you in?</p>

      <div id="sectionToggle">
        <button class="section-btn active" data-section="garden">🌿 Garden</button>
        <button class="section-btn" data-section="rooftop">🏙️ Rooftop</button>
      </div>

      <div id="tableGrid"></div>

      <p id="welcomeError">Please select a table to continue.</p>

      <button id="continueBtn">Continue to Menu</button>
    </div>
  </div>

  <!-- Everything below stays hidden until table is confirmed -->
  <div id="mainContent">

    <div id="stickyTop">
      <div class="brand-row">
        <img src="images/paradise-cafe-logo.jpg" alt="Paradise Cafe" class="header-logo">
        <div>
          <h1>Paradise Cafe</h1>
          <p class="tagline">Dine in the lap of nature</p>
        </div>
      </div>

      <div class="table-badge-row">
        <span id="tableBadge">Table —</span>
        <button id="changeTableBtn">Change</button>
      </div>

      <input type="text" id="searchInput" placeholder="Search dishes...">

      <div id="dietFilterRow">
        <button class="diet-btn active" data-diet="all">All</button>
        <button class="diet-btn" data-diet="veg">Veg</button>
        <button class="diet-btn" data-diet="non-veg">Non-Veg</button>
      </div>
    </div>

    <div id="menuContainer">
      <p class="loading-text">Loading menu...</p>
    </div>

    <h2 class="section-heading">Your Order</h2>
    <div id="cart"></div>

    <button id="menuJumpBtn">☰ Menu</button>

    <div id="categorySheetOverlay">
      <div id="categorySheet">
        <div class="sheet-handle"></div>
        <h3>Jump to a section</h3>
        <div id="categoryListItems"></div>
      </div>
    </div>

    <div id="stickyBar">
      <span id="stickyText">0 items · ₹0</span>
      <button id="placeOrderBtn">Place Order via WhatsApp</button>
    </div>

  </div>

  <script src="script.js"></script>
</body>
</html>
