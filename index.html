<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Paradise Cafe Menu</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
</head>
<body>

  <h1>Paradise Cafe</h1>

  <label for="tableNumber">Select your table number:</label>
  <select id="tableNumber">
    <option value="1">Table 1</option>
    <option value="2">Table 2</option>
    <option value="3">Table 3</option>
    <option value="4">Table 4</option>
    <option value="5">Table 5</option>
    <option value="6">Table 6</option>
    <option value="7">Table 7</option>
    <option value="8">Table 8</option>
    <option value="9">Table 9</option>
    <option value="10">Table 10</option>
    <option value="11">Table 11</option>
    <option value="12">Table 12</option>
  </select>

  <div id="menuContainer">
    <p>Loading menu...</p>
  </div>

  <h2>Your Order</h2>
  <div id="cart"></div>

  <div id="stickyBar">
    <span id="stickyText">0 items - ₹0</span>
    <button id="placeOrderBtn">Place Order via WhatsApp</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
